[package]
name = "athene-contracts"
version = "0.1.0"
edition = "2021"
description = "Shared DTOs and API contracts for Athene services"
license = "MIT OR Apache-2.0"
authors = ["Athene Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "6.0", default-features = false, features = ["macros", "axum_extras", "chrono"] }
# TypeScript bindings for `src/generated/` (see tests/ts_bindings.rs). Only
# derives; nothing is exported at run time.
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl", "uuid-impl", "serde-json-impl"] }

[features]
default = []

# Lint policy (Athene quality overhaul, step 1.1). The same block lives in
# every Athene Rust crate; CI runs `cargo clippy --all-targets -- -D warnings`,
# so "warn" fails the gate too. Tests are exempt from the restriction lints
# via clippy.toml (allow-*-in-tests) or `#![cfg_attr(test, allow(...))]` in
# integration-test crates. Exceptions in production code use
# `#[expect(clippy::..., reason = "...")]` on the narrowest item.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Restriction lints: production code reports errors, it does not crash.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Output goes through `tracing`; the few pre-subscriber prints carry an expect.
print_stdout = "deny"
print_stderr = "deny"
# Pedantic subset: only lints that catch wrong numbers, latent panics or
# silently swallowed values. Style-only pedantic lints (missing_errors_doc,
# must_use_candidate, uninlined_format_args, ...) are deliberately left out.
unchecked_duration_subtraction = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
invalid_upcast_comparisons = "warn"
ignored_unit_patterns = "warn"
match_wildcard_for_single_variants = "warn"
manual_assert = "warn"
maybe_infinite_iter = "warn"
same_functions_in_if_condition = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
